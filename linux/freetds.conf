[global]
    tds version = 7.3
    client charset = UTF-8
    connect timeout = 10
    timeout = 30

# SQL Server nhà máy qua WireGuard
[factory]
    host = 10.80.0.2
    port = 1433
    tds version = 7.3

# Bien the de do hanh vi ma hoa
[factory_noenc]
    host = 10.80.0.2
    port = 1433
    tds version = 7.3
    encryption = off

[factory_require]
    host = 10.80.0.2
    port = 1433
    tds version = 7.3
    encryption = require

# Cho phep TLS 1.0 (danh cho SQL 2008 R2 chua va TLS 1.2)
[factory_tls10]
    host = 10.80.0.2
    port = 1433
    tds version = 7.3
    encryption = require
    enable tls v1 = yes
