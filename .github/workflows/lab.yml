name: lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

concurrency:
  group: lab
  cancel-in-progress: true

jobs:
  sql2008r2-over-wireguard:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CTR: docker
      COMPOSE: docker compose
      CPU_CORES: "4"
      RAM_SIZE: "6G"
      DISK_SIZE: "48G"
    steps:
      - uses: actions/checkout@v4

      - name: Giải phóng ổ đĩa runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h /

      - name: Bật KVM + module WireGuard
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          sudo modprobe wireguard && lsmod | grep -w wireguard

      - name: Cache bộ cài (SQL 2008 R2, SP3, KB4057113, WireGuard, OpenSSH)
        uses: actions/cache@v4
        with:
          path: oem/installers
          key: installers-${{ hashFiles('scripts/download-installers.sh') }}

      - name: Chạy lab (dựng Windows 10 + SQL 2008 R2 Express, test trước/sau vá TLS 1.2)
        run: ./lab.sh all

      - name: Log khi lỗi
        if: failure()
        run: |
          docker ps -a
          docker logs --tail 80 lab-windows || true
          docker logs --tail 40 lab-linux || true

      - name: Lưu kết quả
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
          if-no-files-found: ignore
