name: lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

concurrency:
  group: lab
  cancel-in-progress: true

jobs:
  sql2008r2-over-wireguard:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CTR: docker
      COMPOSE: docker compose
      CPU_CORES: "4"
      RAM_SIZE: "6G"
      DISK_SIZE: "48G"
      SUDO: sudo
    steps:
      - uses: actions/checkout@v4

      - name: Giải phóng ổ đĩa runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h /

      - name: Bật KVM + module WireGuard
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          sudo modprobe wireguard && lsmod | grep -w wireguard

      - name: Cache bộ cài (SQL 2008 R2, SP3, KB4057113, WireGuard, OpenSSH)
        uses: actions/cache@v4
        with:
          path: oem/installers
          key: installers-${{ hashFiles('scripts/download-installers.sh') }}

      # Ổ Windows 10 đã cài xong (OpenSSH + .NET 3.5, CHƯA có SQL) — bỏ qua ~40 phút tải + cài Windows
      - name: Khôi phục cache ổ Windows
        id: wincache
        uses: actions/cache/restore@v4
        with:
          path: cache/win-base.tar.zst
          key: win10-base-v1-${{ hashFiles('oem/install.bat') }}

      - name: Giải nén ổ Windows
        if: steps.wincache.outputs.cache-hit == 'true'
        run: ./lab.sh restore

      - name: Dựng lab + chờ Windows sẵn sàng
        run: ./lab.sh base

      - name: Tạo snapshot ổ Windows
        if: steps.wincache.outputs.cache-hit != 'true'
        run: ./lab.sh snapshot

      - name: Lưu cache ổ Windows
        if: steps.wincache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: cache/win-base.tar.zst
          key: ${{ steps.wincache.outputs.cache-primary-key }}

      - name: Xoá file snapshot (giải phóng ổ)
        if: steps.wincache.outputs.cache-hit != 'true'
        run: rm -f cache/win-base.tar.zst

      - name: Cài SQL 2008 R2 Express + áp dụng đề xuất
        run: ./lab.sh provision

      - name: Test trước/sau vá TLS 1.2
        run: ./lab.sh tests

      - name: Log khi lỗi
        if: failure()
        run: |
          docker ps -a
          docker logs --tail 80 lab-windows || true
          docker logs --tail 40 lab-linux || true

      - name: Lưu kết quả
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
          if-no-files-found: ignore
